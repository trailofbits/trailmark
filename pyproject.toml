[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
only-include = [
    "src", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml",
    "hatch_build.py", "package.json", "package-lock.json",
]

[tool.uv]
# Editable installs must restore generated files even when a wheel is cached.
reinstall-package = ["trailmark"]

[project]
name = "trailmark"
version = "0.5.0"
description = "Parse source code into a queryable graph of functions, classes, calls, and semantic annotations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Trail of Bits, Inc.", email = "opensource@trailofbits.com" },
]
dependencies = [
    # 0.26.0 corrupts Point references during traversal (py-tree-sitter#472).
    "tree-sitter>=0.25.2,<0.27",
    "tree-sitter-language-pack>=1.22.1,<2.0",
    "tree-sitter-sql>=0.3.11,<0.4",
    "rustworkx>=0.18.1,<1.0",
]

[project.urls]
Homepage = "https://github.com/trailofbits/trailmark"
Repository = "https://github.com/trailofbits/trailmark"
Issues = "https://github.com/trailofbits/trailmark/issues"

[project.scripts]
trailmark = "trailmark.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    # tests.run_mutations adapts private APIs from this exact version.
    "pytest-gremlins==1.11.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1,<1.0",
    "pytest-timeout>=2.4,<3",
    "ty>=0.0.89,<0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures/**"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP",
    "ANN", "S", "B", "C4", "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mutation_infrastructure: validate the runner once in its clean baseline"]
