name: Mutation pool audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_pool:
    name: Full pool
    uses: $/.github/workflows/mutation.yml
    with:
      test-group: full
      test-selection: full
      test-order: collection
      full-source: true
  fast_pool:
    name: Fast pool
    uses: $/.github/workflows/mutation.yml
    with:
      test-group: fast
      test-selection: coverage
      full-source: true
  compare:
    name: Compare full and fast pools
    needs: [full_pool, fast_pool]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.9'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --locked --all-groups --extra binary
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mutation-report-*-full-shard-*
          path: coverage/parity/full
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mutation-report-*-fast-shard-*
          path: coverage/parity/fast
      - run: uv run --locked python -m tests.compare_mutations coverage/parity/full coverage/parity/fast > coverage/parity/comparison.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: mutation-pool-comparison
          path: coverage/parity/comparison.json
