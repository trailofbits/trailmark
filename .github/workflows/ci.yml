name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: check
          src: "hatch_build.py src/ tests/"
          version-file: uv.lock

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: format --check
          src: "hatch_build.py src/ tests/"
          version-file: uv.lock

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.9"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - run: npm ci
      - run: uv sync --locked --all-groups

      - run: uv run --locked ty check

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.9"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: npm ci
      - run: uv sync --locked --all-groups

      - run: uv run --locked pytest -q tests/

  binary:
    name: Native Binaries (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [gnu, llvm]
    env:
      TRAILMARK_BINARY_BACKEND: ${{ matrix.backend }}
      TRAILMARK_REQUIRE_BINARY_TOOLS: "1"
      TRAILMARK_LLVM_OBJDUMP: /usr/bin/llvm-objdump
      TRAILMARK_LLVM_SYMBOLIZER: /usr/bin/llvm-symbolizer
      TRAILMARK_GNU_OBJDUMP: /usr/bin/objdump
      TRAILMARK_GNU_SYMBOLIZER: /usr/bin/addr2line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.9"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y llvm binutils-multiarch
      - run: npm ci
      - run: uv sync --locked --all-groups --extra binary
      - run: uv run --locked --extra binary pytest -q tests/test_native_binary.py tests/test_binary_models.py

  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3

      - name: Restore Nix dependencies and build tools
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
        with:
          primary-key: >-
            nix-deps-${{ matrix.os }}-${{ hashFiles('flake.*', 'uv.lock', 'package.json', 'pyproject.toml') }}

      - name: Build Nix dependencies and build tools
        if: github.event_name == 'push' && steps.nix-cache.outputs.hit-primary-key != 'true'
        run: nix build --no-update-lock-file --no-link .#trailmark.ciDependencies

      - name: Save Nix dependencies and build tools
        if: github.event_name == 'push' && steps.nix-cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}

      - name: Build and run flake checks
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Smoke-test the app and development shell
        run: |
          nix run --no-update-lock-file . -- --version
          nix develop --no-update-lock-file -c trailmark --version

  package:
    name: Package Smoke Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.9"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: npm ci
      - run: uv run --no-project --with hatchling python tests/sdist_smoke.py
      - run: uv build --python ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }} /tmp/trailmark-wheel
      - run: uv pip install --python /tmp/trailmark-wheel dist/*.whl
      - run: /tmp/trailmark-wheel/bin/python tests/package_smoke.py tests/fixtures/kat
      - run: uv venv --python ${{ matrix.python-version }} /tmp/trailmark-sdist
      - run: uv pip install --python /tmp/trailmark-sdist dist/*.tar.gz
      - run: /tmp/trailmark-sdist/bin/python tests/package_smoke.py tests/fixtures/kat
