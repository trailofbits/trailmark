name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: check
          src: "hatch_build.py src/ tests/"
          version-file: uv.lock

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: format --check
          src: "hatch_build.py src/ tests/"
          version-file: uv.lock

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - run: npm ci
      - run: uv sync --locked --all-groups

      - run: uv run --locked ty check

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: npm ci
      - run: uv sync --locked --all-groups

      - run: uv run --locked pytest -q tests/

  binary:
    name: Native Binaries (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [gnu, llvm]
    env:
      TRAILMARK_BINARY_BACKEND: ${{ matrix.backend }}
      TRAILMARK_REQUIRE_BINARY_TOOLS: "1"
      TRAILMARK_LLVM_OBJDUMP: /usr/bin/llvm-objdump
      TRAILMARK_LLVM_SYMBOLIZER: /usr/bin/llvm-symbolizer
      TRAILMARK_GNU_OBJDUMP: /usr/bin/objdump
      TRAILMARK_GNU_SYMBOLIZER: /usr/bin/addr2line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y llvm binutils-multiarch
      - run: npm ci
      - run: uv sync --locked --all-groups --extra binary
      - run: uv run --locked --extra binary pytest -q tests/test_native_binary.py tests/test_binary_models.py

  package:
    name: Package Smoke Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: npm ci
      - run: uv run --no-project --with hatchling python tests/sdist_smoke.py
      - run: uv build --python ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }} /tmp/trailmark-wheel
      - run: uv pip install --python /tmp/trailmark-wheel dist/*.whl
      - run: /tmp/trailmark-wheel/bin/python tests/package_smoke.py tests/fixtures/kat
      - run: uv venv --python ${{ matrix.python-version }} /tmp/trailmark-sdist
      - run: uv pip install --python /tmp/trailmark-sdist dist/*.tar.gz
      - run: /tmp/trailmark-sdist/bin/python tests/package_smoke.py tests/fixtures/kat
