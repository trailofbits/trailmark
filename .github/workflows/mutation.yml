name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gremlins:
    name: Mutation shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}/8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - run: npm ci
      - run: uv sync --locked --all-groups

      - name: Run reviewed mutation scope
        if: github.event_name == 'pull_request'
        run: uv run --locked python -m tests.run_mutations --reviewed --workers=4 --shard="$MUTATION_SHARD"

      - name: Run full mutation campaign
        if: github.event_name != 'pull_request'
        run: uv run --locked python -m tests.run_mutations --workers=4 --shard="$MUTATION_SHARD"

      - name: Enforce reviewed Rust and Verus baseline
        run: uv run --locked python -m tests.mutation_gate --shard="$MUTATION_SHARD"

      - name: Record revision
        if: always()
        run: |
          mkdir -p coverage/gremlins
          git rev-parse HEAD > coverage/gremlins/revision.txt

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-report-${{ github.sha }}-shard-${{ matrix.shard }}
          path: coverage/gremlins/
          if-no-files-found: error

  mutation-gate:
    name: Mutation Testing
    if: always()
    needs: gremlins
    runs-on: ubuntu-latest
    steps:
      - name: Require all mutation shards to pass
        env:
          MUTATION_RESULT: ${{ needs.gremlins.result }}
        run: test "$MUTATION_RESULT" = success
