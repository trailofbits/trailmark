name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gremlins:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - run: npm ci
      - run: uv sync --locked --all-groups

      - name: Run reviewed mutation scope
        if: github.event_name == 'pull_request'
        run: uv run --locked python -m tests.run_mutations --reviewed --workers=4

      - name: Run full mutation campaign
        if: github.event_name != 'pull_request'
        run: uv run --locked python -m tests.run_mutations --workers=4

      - name: Enforce reviewed Rust and Verus baseline
        run: uv run --locked python -m tests.mutation_gate

      - name: Record revision
        if: always()
        run: |
          mkdir -p coverage/gremlins
          git rev-parse HEAD > coverage/gremlins/revision.txt

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-report-${{ github.sha }}
          path: coverage/gremlins/
          if-no-files-found: error
