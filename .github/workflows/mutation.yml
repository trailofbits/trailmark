name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gremlins:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - run: uv sync --locked --all-groups

      - name: Run mutation testing
        run: uv run python -m tests.run_mutations --workers=4

      - name: Enforce reviewed Rust and Verus baseline
        run: uv run python -m tests.mutation_gate

      - name: Record revision
        if: always()
        run: |
          mkdir -p coverage/gremlins
          git rev-parse HEAD > coverage/gremlins/revision.txt

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutation-report-${{ github.sha }}
          path: coverage/gremlins/
          if-no-files-found: error
