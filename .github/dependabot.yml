version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Mutation runner adapts private APIs; upgrades need manual revalidation.
      - dependency-name: pytest-gremlins
      # Native Point lifetime regression; upgrading segfaults parser tests.
      # https://github.com/tree-sitter/py-tree-sitter/issues/472
      - dependency-name: tree-sitter
        versions: ["0.26.0"]
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
